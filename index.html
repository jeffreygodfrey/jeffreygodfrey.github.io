<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight Forge</title>
    <!-- TODO: placeholder for favicon -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
    <script>
      (function () {
        const stored = localStorage.getItem('theme'); // 'light' | 'dark' | null

        const resolved = stored === 'light' || stored === 'dark'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
    <link rel="stylesheet" href="css/style.css">
    <meta name="color-scheme" content="dark">
</head>

  <body>

    <!-- Header -->
    <div class="page-top">
      <button id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
          <svg class="hamburger-icon" viewBox="0 0 24 24" width="24" height="24">
          <line class="bar bar-top"    x1="3" y1="6"  x2="21" y2="6"  />
          <line class="bar bar-middle" x1="3" y1="12" x2="21" y2="12" />
          <line class="bar bar-bottom" x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <div class="logo">Logo</div>
      <header><h1 class="site-title">Insight Forge</h1></header>
    </div>
    <div class="divider-header"></div>

    <!-- Navigation -->
    <div id="nav-backdrop"></div>
    <div class="nav-bg"></div>
    <nav id="site-nav" aria-label="Site" aria-hidden="true">
      <ul class="nav"></ul>
      <div class="theme-switch">
        <select id="theme-select" class="theme-select">
          <button>
            <selectedcontent></selectedcontent>
          </button>
          <option value="system">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><path d="M12 2v2"/><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"/><path d="M16 12a4 4 0 0 0-4-4"/><path d="m19 5-1.256 1.256"/><path d="M20 12h2"/></svg>
            <div class="theme-option-label">System</div>
          </option>
          <option value="light">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <div class="theme-option-label">Light</div>
          </option>
          <option value="dark">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
            <div class="theme-option-label">Dark</div>
          </option>
        </select>
      </div>
    </nav>

    <main>
      <section class="article-content" id="home"></section>
      <article class="article-content" id="article-content"></article>
    </main>

    <aside>

    </aside>

  <script src="js/main.js"></script>
  </body>
</html>
